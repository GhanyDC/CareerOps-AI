name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://careerops:careerops_ci@127.0.0.1:5432/careerops_ci?schema=public
      BETTER_AUTH_SECRET: sQ9wX2mN7vK4pL8rT6yH3cF5jD1zB0aE
      BETTER_AUTH_URL: https://careerops-ci.invalid
      AUTH_TRUSTED_ORIGINS: https://careerops-ci.invalid
      GOOGLE_CLIENT_ID: 123456789012-abcdefghijklmnopqrstuvwxyz012345.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: GOCSPX-abcdefghijklmnopqrstuvwxyz123456
      DEVELOPMENT_IDENTITY_ENABLED: "false"
      DEVELOPMENT_SEED_ENABLED: "false"
      DEVELOPMENT_USER_KEY: careerops-ci-development
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_DB: careerops_ci
          POSTGRES_USER: careerops
          POSTGRES_PASSWORD: careerops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=careerops --dbname=careerops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy database migrations
        run: npm run db:migrate:deploy

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Seed development identity and candidate evidence
        run: npm run db:seed
        env:
          DEVELOPMENT_SEED_ENABLED: "true"

      - name: Confirm development seed idempotence
        run: npm run db:seed
        env:
          DEVELOPMENT_SEED_ENABLED: "true"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full release verification
        id: release
        run: npm run verify:release

      - name: Upload Playwright report
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
